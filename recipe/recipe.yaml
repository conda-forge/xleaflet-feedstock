context:
  version: "0.22.0"
  build_number: 0

package:
  name: xleaflet
  version: ${{ version }}

source:
  url: https://github.com/jupyter-xeus/xleaflet/archive/${{ version }}.tar.gz
  sha256: 9ae1b03a7997352331c708c588d4f832cf87c46a887724bfb32e96bce03d9b36

build:
  number: ${{ build_number }}

requirements:
  run_exports:
    - ${{ pin_subpackage('xleaflet', upper_bound='x.x') }}
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - if: unix
      then:
        - make
  host:
    - xeus >=6.0.0,<7.0
    - xproperty >=0.12.1,<0.13.0
    - xwidgets >=0.30,<0.31.0
    - xtensor >=0.27.0,<0.28
    - nlohmann_json
    - nlohmann_json-abi
  run:
    - xtensor >=0.27,<0.28

tests:
  - package_contents:
      files:
        exists:
          - ${{ "Library/" if win }}include/xleaflet/xmap.hpp
          - ${{ "Library/" if win }}lib/cmake/xleaflet/xleafletConfig.cmake
          - ${{ "Library/" if win }}lib/cmake/xleaflet/xleafletConfigVersion.cmake

about:
  homepage: http://quantstack.net/xleaflet
  repository: https://github.com/jupyter-xeus/xleaflet
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: C++ backend for the jupyter leaflet widget
  documentation: http://xleaflet.readthedocs.io

extra:
  recipe-maintainers:
    - SylvainCorlay
    - JohanMabille
    - martinRenou
